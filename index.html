<!DOCTYPE html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #13233F;
    --tag: #FFD23F;
    --strap: #C9D2E3;
    --wa: #1FB85A;
    --radius: 28px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100dvh;
    background: var(--navy);
    color: var(--navy);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
    overflow-x: hidden;
  }

  .swing {
    width: min(100%, 380px);
    transform-origin: 50% 0;
    animation: swing 2.6s cubic-bezier(.3, .6, .4, 1) both;
  }
  @keyframes swing {
    0%   { transform: rotate(8deg); }
    25%  { transform: rotate(-5deg); }
    50%  { transform: rotate(3deg); }
    75%  { transform: rotate(-1.2deg); }
    100% { transform: rotate(0); }
  }

  .strap {
    width: 14px;
    height: 72px;
    margin: 0 auto -30px;
    background: var(--strap);
    border-radius: 7px 7px 0 0;
    position: relative;
    z-index: 0;
  }

  .tag {
    position: relative;
    z-index: 1;
    background: var(--tag);
    border-radius: var(--radius);
    padding: 52px 22px 22px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
  }
  .tag::before {            /* punched hole */
    content: "";
    position: absolute;
    top: 14px; left: 50%;
    width: 22px; height: 22px;
    margin-left: -11px;
    background: var(--navy);
    border-radius: 50%;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, .5);
  }

  .case { display: block; width: 96px; height: auto; margin: 6px auto 14px; }

  h1 {
    margin: 0 0 4px;
    text-align: center;
    font-size: 2.1rem;
    line-height: 1.05;
    font-weight: 800;
    letter-spacing: -.02em;
  }
  .sub { margin: 0 0 22px; text-align: center; font-weight: 500; opacity: .75; }

  .row { display: flex; gap: 10px; margin-bottom: 10px; }
  .row a {
    display: flex; align-items: center; justify-content: center;
    height: 62px;
    border-radius: 20px;
    text-decoration: none;
    font: inherit;
    transition: transform .12s ease;
  }
  .row a:active { transform: scale(.97); }
  .row a:focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }

  .call {
    flex: 1;
    gap: 12px;
    background: var(--navy);
    color: #fff;
    font-weight: 800;
    font-size: 1.15rem;
    letter-spacing: .01em;
    font-variant-numeric: tabular-nums;
  }
  .wa { width: 62px; background: var(--wa); color: #fff; }
  .call svg, .wa svg { width: 24px; height: 24px; flex: none; }

  .barcode {
    height: 44px;
    margin-top: 22px;
    border-radius: 6px;
    background:
      repeating-linear-gradient(90deg,
        var(--navy) 0 3px, transparent 3px 5px,
        var(--navy) 5px 6px, transparent 6px 10px,
        var(--navy) 10px 15px, transparent 15px 17px,
        var(--navy) 17px 18px, transparent 18px 22px);
    opacity: .9;
  }

  @media (prefers-reduced-motion: reduce) {
    .swing { animation: none; }
    .row a { transition: none; }
  }
</style>
</head>
